server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS resolves a recreated API container without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api http://api:8000;

    # Preserve all FastAPI paths, query strings, Last-Event-ID and public Host.
    # API docs/OpenAPI and health routes must never fall through to React.
    location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$|health(?:/|$)) {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 504 =503 @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"detail":"Nginx could not connect to FastAPI at api:8000 or the upstream timed out. Check docker compose logs api nginx for the underlying error."}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
